name: Chatbot API — embeddings + deploy

on:
  push:
    branches: ["main"]
    paths:
      - "api/**"
  workflow_dispatch:

permissions:
  contents: write

# Prevent overlapping runs from racing on embeddings.json or the deploy.
concurrency:
  group: chatbot-api
  cancel-in-progress: false

jobs:
  embed-and-deploy:
    # Secrets (OpenRouter, Cloudflare) and contents:write are only ever exposed to
    # code on main — a manual run from another branch is skipped.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        working-directory: api
        run: npm ci

      # Only re-embed when the knowledge base text no longer matches embeddings.json.
      # (Swapping the chat model does not need this; swapping the embedding model does.)
      - name: Rebuild embeddings if stale
        working-directory: api
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: npm run check:embeddings || node scripts/embed.mjs

      - name: Verify embeddings
        working-directory: api
        run: npm run check:embeddings

      - name: Commit updated embeddings
        run: |
          if git diff --quiet -- api/src/embeddings.json; then
            echo "Embeddings already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/src/embeddings.json
          git commit -m "chore(api): rebuild embeddings [skip ci]"
          git push

      # Needs repo secrets CLOUDFLARE_API_TOKEN (template: "Edit Cloudflare Workers")
      # and CLOUDFLARE_ACCOUNT_ID. Skipped with a warning until they exist.
      - name: Deploy Worker
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN not set — skipping deploy. Run 'cd api && npx wrangler deploy' manually."
            exit 0
          fi
          npx wrangler deploy
